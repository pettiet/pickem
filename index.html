<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12211A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="The Sheet">
<title>The Sheet · College Football Pick'em</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root{
    --field:#EEF1EC;      /* misty turf */
    --ink:#12211A;        /* deep green-black */
    --ink-2:#3D4F45;
    --mute:#74847B;
    --line:#D6DDD6;
    --card:#FFFFFF;
    --flag:#F2B705;       /* goalpost yellow */
    --win:#1F8A4C;
    --loss:#C0392B;
    --lock:#9AA69F;
    --radius:14px;
    --shadow:0 1px 2px rgba(18,33,26,.06),0 6px 20px rgba(18,33,26,.06);
    --display:"Barlow Condensed",Impact,sans-serif;
    --body:"Inter",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--field);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
  .app{max-width:760px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}

  /* ── header ─────────────────────────────── */
  header{padding:18px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .brand h1{font-family:var(--display);font-weight:800;font-size:44px;line-height:.9;margin:0;letter-spacing:-.01em;text-transform:uppercase}
  .brand h1 span{color:var(--flag);-webkit-text-stroke:1.5px var(--ink);color:transparent}
  .brand .eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
  .who{display:flex;gap:6px}
  .who button{padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px;color:var(--ink-2)}
  .who button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .who .me{padding:8px 14px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:14px}

  /* ── reminders (bell + panel) ───────────── */
  .who{align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .who .bell{padding:0;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink-2)}
  .who .bell svg{width:18px;height:18px}
  .who .bell.on{background:var(--flag);border-color:var(--flag);color:var(--ink)}
  .remind{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px 16px;margin:2px 0 10px}
  .remind[hidden]{display:none}
  .remind .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .remind .rh b{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
  .remind .rh button{width:32px;height:32px;border-radius:50%;background:#E2E7E1;font-size:18px;line-height:1;color:var(--ink-2)}
  .remind p{margin:0 0 10px;font-size:13px;color:var(--ink-2)}
  .remind ol{margin:0 0 10px;padding-left:20px;font-size:13px;color:var(--ink-2)}
  .remind ol li{margin-bottom:4px}
  .remind .go{display:block;width:100%;padding:12px;border-radius:12px;background:var(--ink);color:#fff;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.05em;text-transform:uppercase}
  .remind .go:disabled{opacity:.5}
  .remind label{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #EEF1EC;font-weight:600;font-size:14px}
  .remind input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink)}
  .remind .row{display:flex;gap:8px;margin-top:10px}
  .remind .row button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);font-weight:600;font-size:13px;color:var(--ink-2)}
  .remind .msg{margin:10px 0 0;font-size:13px;font-weight:600;color:var(--win)}
  .remind .msg.err{color:var(--loss)}
  .sports button{position:relative}
  .sports .cnt{position:absolute;top:-5px;right:-3px;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--loss);color:#fff;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:0;line-height:17px;text-align:center;box-shadow:0 0 0 2px var(--field)}
  .welcome .paste{display:flex;gap:8px;margin-top:4px}
  .welcome .paste input{flex:1;min-width:0;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
  .welcome .paste button{padding:10px 16px;border-radius:10px;background:var(--ink);color:#fff;font-weight:600}

  /* ── sport switch ───────────────────────── */
  .sports{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#E2E7E1;padding:4px;border-radius:12px;margin:4px 0 8px}
  .sports button{padding:9px 0;border-radius:9px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
  .sports button.on{background:var(--ink);color:#fff;box-shadow:var(--shadow)}
  .sports button.on i{color:var(--flag)}
  .sports button i{font-style:normal;margin-right:6px}
  .sports[hidden]{display:none}
  body[data-sport="cbb"]{--flag:#F07A1A}   /* hardwood orange */
  body[data-sport="cbb"] .matchup{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}   /* long school names shorten with … instead of squeezing the other team */
  .team .nologo{width:36px;height:36px;flex:none;border-radius:50%;background:#E2E7E1;color:var(--ink-2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.02em}

  /* ── basketball occasions (Feast Week and friends) ── */
  .occ{display:flex;align-items:center;gap:12px;background:var(--card);border-left:5px solid var(--flag);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;margin:0 0 10px}
  .occ i{font-style:normal;font-size:28px;line-height:1}
  .occ b{display:block;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
  .occ span{font-size:12px;color:var(--ink-2)}
  .evt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 12px;background:#F4F6F3;border-bottom:1px solid #EEF1EC;border-left:4px solid var(--flag);font-size:11px;color:var(--ink-2)}
  .evt .t{display:flex;align-items:baseline;min-width:0;font-weight:600;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
  .evt .t b{color:var(--ink);font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .evt .t em{font-style:normal;flex:none;max-width:55%;overflow:hidden;text-overflow:ellipsis}   /* the round stays readable; a long event name shortens first */
  .evt .t i{font-style:normal;font-size:14px;margin-right:6px;letter-spacing:0}
  .evt .where{flex:none;color:var(--mute);font-weight:500}
  .pl .case{margin-top:8px;font-size:20px;letter-spacing:3px;line-height:1.3}
  .emo{width:1em;height:1em;vertical-align:-.15em;display:inline-block}
  /* trophy games (football postseason): highlighted card + total-points tiebreaker */
  .game.trophy{box-shadow:0 0 0 2px var(--flag),var(--shadow)}
  .tbk{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid #EEF1EC;background:#FBF8EE}
  .tbk .ti{font-size:26px;line-height:1;flex:none}
  .tbk .tx{flex:1;min-width:0}
  .tbk .tx b{display:block;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
  .tbk .tx small{display:block;font-size:12px;color:var(--ink-2);line-height:1.35}
  .tbk label{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;flex:none}
  .tbk input{width:66px;font:inherit;font-size:18px;font-weight:700;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:6px 4px;color:var(--ink);background:#fff}
  .tbk input:focus{outline:3px solid var(--flag);outline-offset:1px;border-color:var(--ink)}
  .sheet .p small{display:block;font-family:var(--body);font-size:10px;font-weight:500;color:var(--mute);text-decoration:none}

  /* ── week bar ───────────────────────────── */
  .weekbar{display:flex;align-items:center;justify-content:space-between;background:var(--bar,var(--ink));color:#fff;border-radius:var(--radius);padding:6px 6px;margin:6px 0 10px;box-shadow:var(--shadow)}
  .weekbar button{width:44px;height:44px;border-radius:10px;font-size:22px;display:grid;place-items:center;color:#fff}
  .weekbar button:disabled{opacity:.25;cursor:default}
  .weekbar button:not(:disabled):hover{background:rgba(255,255,255,.1)}
  .weekbar .w{text-align:center}
  .weekbar .w b{font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.02em;line-height:1;display:block}
  .weekbar .w small{font-size:12px;color:rgba(255,255,255,.65);display:block;margin-top:2px}

  /* ── tabs ───────────────────────────────── */
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#E2E7E1;padding:4px;border-radius:12px;margin-bottom:12px}
  .tabs button{padding:10px 0;border-radius:9px;font-weight:600;color:var(--ink-2);font-size:14px}
  .tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

  /* ── "scores updated" line ──────────────── */
  .fresh{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin:-6px 2px 8px;font-size:12px;color:var(--mute)}
  .fresh[hidden]{display:none}
  .fresh button{padding:6px 4px;font-weight:600;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}
  .fresh button:disabled{opacity:.5;text-decoration:none}

  /* ── filters ────────────────────────────── */
  .filters{display:flex;gap:8px;margin:0 0 10px}
  .filters input,.filters select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;box-shadow:var(--shadow)}
  .searchwrap{position:relative;flex:1;min-width:0;display:flex}
  .searchwrap input{flex:1;min-width:0;width:100%;padding-right:38px}
  .searchwrap .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:#E2E7E1;color:var(--ink-2);font-size:18px;line-height:1;display:grid;place-items:center}
  .searchwrap .clear:hover{background:var(--line)}
  input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
  .filters input::placeholder{color:var(--mute)}
  .filters select{max-width:46%;-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%2374847B'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:30px}
  .filters input:focus,.filters select:focus{outline:3px solid var(--flag);outline-offset:1px;border-color:var(--ink)}
  .fcount{font-size:12px;color:var(--mute);white-space:nowrap}

  /* ── progress ───────────────────────────── */
  .progress{display:flex;align-items:center;gap:12px;margin:2px 2px 12px;font-size:13px;color:var(--ink-2)}
  .progress .bar{flex:1;height:6px;border-radius:3px;background:#DDE3DC;overflow:hidden}
  .progress .bar i{display:block;height:100%;background:var(--flag);width:0;transition:width .3s}
  .progress b{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.02em}

  /* ── day groups & game cards ────────────── */
  .day{margin:18px 0 8px;display:flex;align-items:baseline;gap:10px}
  .day h2{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.04em;margin:0}
  .day span{font-size:12px;color:var(--mute);font-weight:500}
  .game{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden}
  .matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch}
  .team{display:flex;align-items:center;gap:10px;padding:12px 10px;text-align:left;position:relative;transition:background .15s,color .15s;min-height:66px}
  .team img{width:36px;height:36px;object-fit:contain;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
  .team .n{min-width:0;flex:1}
  .team .rk{font-size:11px;font-weight:600;color:var(--mute);letter-spacing:.04em}
  .team .nm{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .team .rec{font-size:11px;color:var(--mute)}
  .team .sc{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
  .team.home{flex-direction:row-reverse;text-align:right}
  .team.home .sc{text-align:left}
  .team.picked{color:#fff}
  .team.picked .rk,.team.picked .rec{color:rgba(255,255,255,.75)}
  .team.picked .nm::after{content:"✓";margin-left:6px;font-size:14px;vertical-align:middle}
  .team.home.picked .nm::after{content:"";margin:0}
  .team.home.picked .nm::before{content:"✓";margin-right:6px;font-size:14px;vertical-align:middle}
  .team.dim{opacity:.55}
  .team:disabled{cursor:default}
  .team:not(:disabled):hover{background:#F4F6F3}
  .team.picked:not(:disabled):hover{filter:brightness(1.08);background:var(--tc)}
  .at{display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--mute);font-size:14px;padding:0 4px;letter-spacing:.06em}
  .meta{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-top:1px solid #EEF1EC;font-size:12px;color:var(--mute)}
  .meta .st{font-weight:600}
  .meta .st.live{color:var(--loss)}
  .meta .st.final{color:var(--ink-2)}
  .meta .grade{font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px}
  .grade.ok{background:#DDF3E5;color:var(--win)}
  .grade.bad{background:#F9E1DD;color:var(--loss)}
  .grade.lock{background:#EDF0EC;color:var(--lock)}
  .meta .mr{display:flex;align-items:center;gap:6px}
  .fav{width:30px;height:30px;margin:-6px -4px -6px 0;border-radius:50%;display:grid;place-items:center;font-size:17px;color:var(--lock);line-height:1}
  .fav:hover{background:#F4F6F3}
  .fav.on{color:#E0435C}
  .day.sec h2{color:var(--ink)}
  .day.sec.finals{margin-top:26px;padding-top:14px;border-top:2px solid var(--line)}

  /* ── sheet (compare) ────────────────────── */
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);font-size:13px}
  th,td{padding:9px 8px;border-bottom:1px solid #EEF1EC;text-align:center;vertical-align:middle}
  th{font-family:var(--display);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--ink);color:#fff}
  td:first-child,th:first-child{text-align:left}
  .sheet .g{font-weight:600;white-space:nowrap}
  .sheet .g small{display:block;color:var(--mute);font-weight:400;font-size:11px}
  .sheet .p{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em}
  .sheet .p.ok{color:var(--win)}
  .sheet .p.bad{color:var(--loss);text-decoration:line-through;text-decoration-thickness:2px}
  .sheet .p.bad.none{text-decoration:none;font-family:var(--body);font-size:11px;font-weight:600;color:var(--loss)}
  .sheet .p.hid{color:var(--lock);font-family:var(--body);font-size:11px;font-weight:500}
  .sheet .p.none{color:var(--line)}
  .sheet tfoot td{font-family:var(--display);font-size:18px;font-weight:800;background:#F4F6F3}

  /* ── standings ──────────────────────────── */
  .podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:14px}
  .pl{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 14px 12px;position:relative;overflow:hidden}
  .pl.lead{background:var(--ink);color:#fff}
  .pl .name{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em}
  .pl .rec{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
  .pl .sub{font-size:12px;color:var(--mute)}
  .pl.lead .sub{color:rgba(255,255,255,.7)}
  .pl .crown{position:absolute;top:10px;right:12px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
  .pl.lead .crown{color:var(--flag)}
  .wk td.best{font-weight:700;color:var(--win)}
  .wk td.w{text-align:left;font-weight:600}

  /* ── welcome ────────────────────────────── */
  .welcome{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 18px;text-align:center;margin-top:8px}
  .welcome b{display:block;font-family:var(--display);font-size:34px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;line-height:1}
  .welcome p{color:var(--mute);font-size:13px;margin:8px 0 18px}
  .choices{display:grid;gap:10px}
  .choices button{padding:16px;border-radius:12px;background:var(--ink);color:#fff;font-family:var(--display);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .choices button:hover{background:#1E3A2C}

  /* ── misc ───────────────────────────────── */
  .empty{padding:40px 16px;text-align:center;color:var(--mute)}
  .empty b{display:block;font-family:var(--display);font-size:24px;color:var(--ink);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .toast.err{background:var(--loss)}
  .note{font-size:12px;color:var(--mute);text-align:center;margin:18px 0 0}
  .banner{background:#FFF4CC;border:1px solid #F2D77A;color:#6B5200;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px}
  .banner code{font-size:12px;background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px}
  @media (max-width:420px){
    .brand h1{font-size:36px}
    .team{padding:10px 8px;gap:8px}
    .team img,.team .nologo{width:30px;height:30px}
    .team .nologo{font-size:11px}
    .team .nm{font-size:17px}
    .team .sc{font-size:26px;min-width:32px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="eyebrow" id="eyebrow">College Football Pick'em</div>
      <h1 id="title">The <span>Sheet</span></h1>
    </div>
    <div class="who" id="who"></div>
  </header>

  <div class="remind" id="remind" hidden></div>

  <div class="sports" id="sports" role="tablist" aria-label="Sport" hidden>
    <button role="tab" data-sport="cfb"><i>🏈</i>Football</button>
    <button role="tab" data-sport="cbb"><i>🏀</i>Basketball</button>
  </div>

  <div class="weekbar">
    <button id="prev" aria-label="Previous week">‹</button>
    <div class="w"><b id="wlabel">Week —</b><small id="wdates">loading schedule…</small></div>
    <button id="next" aria-label="Next week">›</button>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="picks" class="on">My picks</button>
    <button role="tab" data-tab="sheet">The sheet</button>
    <button role="tab" data-tab="standings">Standings</button>
  </div>

  <div class="fresh" id="fresh" hidden><span id="freshat"></span><button type="button" id="refresh">Refresh</button></div>

  <div id="banner"></div>
  <main id="view"><div class="empty">Loading…</div></main>
  <p class="note" id="footnote">Scores from ESPN · picks lock at kickoff · refreshes every 2 min during games</p>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const C = window.PICKEM_CONFIG;
  const ESPN_BASE = `https://site.api.espn.com/apis/site/v2/sports`;

  // Who takes a trophy game: of those who picked the winner, the closest total points.

  function trophyWinners(g, week, sp = S.sport) {
    if (!g.trophy || !g.completed || !g.winner) return [];
    const D = DATA[sp], picks = D.picks[week] || {}, tb = D.tb[week] || {};
    const total = g.home.score + g.away.score;
    const right = C.PLAYERS.filter(p => picks[key(g.id, p)] === g.winner);
    const pool = right.length ? right : C.PLAYERS.filter(p => tb[key(g.id, p)] != null);
    const off = p => tb[key(g.id, p)] != null ? Math.abs(tb[key(g.id, p)] - total) : Infinity;

  // ── ESPN ─────────────────────────────────────────────────────────────────
  function normalize(ev, day, post) {
    const c = ev.competitions[0];
    const t = side => {
      const x = c.competitors.find(k => k.homeAway === side);
      const rk = x.curatedRank?.current;
      return {
        id: x.team.id, abbr: x.team.abbreviation, name: x.team.shortDisplayName || x.team.location,
        full: x.team.displayName, logo: x.team.logo, color: x.team.color || "12211A",

      id: ev.id, date, tbd, event, place, region, home, away, winner, post: !!post, cfp, round: round ? round[1] : null, trophy,
      state: st.state, completed: !!st.completed, statusName: st.name || "", statusText: st.shortDetail || st.description || "",

  }

  // Football named weeks in the regular season, found by date so they land right every year.
  function tagFootballWeeks(D) {
    if (C.FOOTBALL_OCCASIONS === false) return;
    const Y = C.SEASON, noon = (m, d) => new Date(Y, m, d, 12);
    const weekOf = d => D.calendar.find(w => w.n > 0 && d >= w.start && d <= w.end);
    const nov1 = noon(10, 1), thanks = new Date(+nov1 + (((4 - nov1.getDay() + 7) % 7) + 21) * 864e5);
    const dec1 = noon(11, 1), sat2 = new Date(+dec1 + (((6 - dec1.getDay() + 7) % 7) + 7) * 864e5);   // second Saturday of December
    const tag = (w, k) => { if (w && !w.special) w.special = FB_OCC[k]; };
    tag(weekOf(sat2), "armynavy");
    tag(weekOf(new Date(+thanks + 9 * 864e5)), "champs");      // the Saturday after Thanksgiving weekend
    tag(weekOf(new Date(+thanks + 2 * 864e5)), "rivalry");     // Thanksgiving weekend
    tag(weekOf(noon(9, 31)), "halloween");

  // Football postseason: ESPN lists every bowl and playoff game as one long "week". The app splits it:
  // regular bowls Monday to Sunday (Bowl Week 1, 2, 3…, saved as weeks 16-19) and each playoff round on
  // its own (saved as weeks 21-24). Week numbers are fixed, so saved picks always find their game.
  async function loadPost(force) {
    const D = DATA.cfb, P = D.post;
    if (P.list && !force && Date.now() - (P.at || 0) < 120000) return P.list;
    if (P.pending) return P.pending;
    P.pending = (async () => {
      const r = await fetch(`${ESPN}?groups=${C.ESPN_GROUP}&seasontype=3&week=1&dates=${C.SEASON}&limit=500`);
      if (!r.ok) throw new Error("ESPN " + r.status);
      const j = await r.json();
      const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const s0 = dayStart(P.start || new Date(C.SEASON, 11, 13));
      const mon = new Date(+s0 + ((8 - s0.getDay()) % 7) * 864e5);   // first Monday on or after the postseason start
      const list = (j.events || []).map(ev => normalize(ev, null, true));
      list.forEach(g => {
        if (g.cfp && g.round) g.wk = g.round;
        else g.wk = 16 + Math.max(0, Math.min(3, Math.floor((dayStart(g.date) - mon) / (7 * 864e5))));
      });
      P.list = list; P.at = Date.now();
      // (Re)build the postseason part of the calendar from whichever games ESPN has posted.
      const fd = d => d.toLocaleDateString([], { month: "short", day: "numeric" });
      const entries = [...new Set(list.map(g => g.wk))].map(n => {
        const gs = list.filter(g => g.wk === n), first = dayStart(new Date(Math.min(...gs.map(g => +g.date)))), last = dayStart(new Date(Math.max(...gs.map(g => +g.date))));
        const isBowl = n < 20, cfpRound = CFP_ROUNDS.find(r => r[1] === n);
        const label = isBowl ? `Bowl Week ${n - 15}` : cfpRound[2];
        const special = { ...(isBowl ? FB_OCC.bowl : n === 24 ? FB_OCC.title : FB_OCC.cfp), name: label };
        return { n, label, detail: +first === +last ? fd(first) : `${fd(first)}–${fd(last)}`, start: first, end: new Date(+last + 28 * 3600e3 - 1), special, post: true };
      });
      D.calendar = [...D.calendar.filter(w => !w.post), ...entries].sort((a, b) => a.start - b.start || a.n - b.n);
      return list;
    })();
    try { return await P.pending; } finally { P.pending = null; }
  }

  async function loadWeek(n, force, sp = S.sport) {
    if (sp === "cbb") return loadHoopsWeek(n, force);
    const D = DATA.cfb;
    if (n >= 16) {   // bowls and playoff
      const stale = Date.now() - (D.fetchedAt[n] || 0) > 120000;
      if (D.games[n] && !stale && !force) return D.games[n];
      const list = await loadPost(force || stale);
      D.games[n] = list.filter(g => g.wk === n).sort((a, b) => a.date - b.date);
      D.fetchedAt[n] = Date.now();
      return D.games[n];
    }
    const stale = Date.now() - (D.fetchedAt[n] || 0) > 120000;
    if (D.games[n] && !stale && !force) return D.games[n];
    const url = `${ESPN}?groups=${C.ESPN_GROUP}&seasontype=2&week=${dbWeek(n, "cfb")}&dates=${C.SEASON}&limit=500`;
    const r = await fetch(url);
    if (!r.ok) throw new Error("ESPN " + r.status);
    const j = await r.json();
    if (!D.calendar.length) {
      const reg = (j.leagues?.[0]?.calendar || []).find(x => x.value === "2") || {};
      D.calendar = (reg.entries || []).map(e => ({ n: +e.value, label: e.label, detail: e.detail, start: new Date(e.startDate), end: new Date(e.endDate) }));
      // ESPN files the "Week 0" games under Week 1. Split them out for display.
      const w1 = D.calendar.find(w => w.n === 1);
      if (w1 && WEEK0_END > w1.start && WEEK0_END < w1.end) {
        const fd = d => d.toLocaleDateString([], { month: "short", day: "numeric" });
        D.calendar.unshift({ n: 0, label: "Week 0", detail: `${fd(w1.start)}–${fd(new Date(WEEK0_END - 1))}`, start: w1.start, end: new Date(WEEK0_END - 1) });
        w1.start = WEEK0_END; w1.detail = `${fd(WEEK0_END)}–${fd(w1.end)}`;
      }
      const postCal = (j.leagues?.[0]?.calendar || []).find(x => x.value === "3")?.entries?.[0];
      D.post.start = postCal ? new Date(postCal.startDate) : new Date(C.SEASON, 11, 13);
      tagFootballWeeks(D);
      try { await loadPost(); } catch (e) { console.warn("postseason:", e.message || e); }   // not posted yet: regular season only
    }
    let evs = (j.events || []).map(ev => normalize(ev));
    if (n === 0) evs = evs.filter(g => g.date < WEEK0_END);
    else if (n === 1 && D.calendar[0]?.n === 0) evs = evs.filter(g => g.date >= WEEK0_END);
    D.games[n] = evs.sort((a, b) => a.date - b.date);
    D.fetchedAt[n] = Date.now();
    return D.games[n];
  }

  // ── basketball schedule ──────────────────────────────────────────────────
  // ESPN has no "weeks" for basketball, so the app makes its own: Monday through Sunday,
  // matching the AP poll (new rankings every Monday). Week 1 runs from Nov 1 through the
  // first Sunday after opening Monday; the last week runs through the title game.
  const DAY = 864e5;
  function buildHoopsCalendar() {
    const D = DATA.cbb;
    if (D.calendar.length) return;
    const Y = SPORTS.cbb.season;
    const utc = (y, m, d) => new Date(Date.UTC(y, m, d, 12));
    const firstMonday = (y, m) => { const d = utc(y, m, 1); return new Date(+d + ((8 - d.getUTCDay()) % 7) * DAY); };
    const title = firstMonday(Y, 3);                           // national championship: first Monday of April
    const spans = [];
    let s = utc(Y - 1, 10, 1), e = new Date(+firstMonday(Y - 1, 10) + 6 * DAY);
    while (s <= title) { spans.push([s, e > title ? title : e]); s = new Date(+e + DAY); e = new Date(+s + 6 * DAY); }
    if (spans.length > 1 && spans[spans.length - 1][1] - spans[spans.length - 1][0] < 2 * DAY) { const last = spans.pop(); spans[spans.length - 1][1] = last[1]; }
    const ymd = d => d.toISOString().slice(0, 10).replace(/-/g, "");
    const local = (d, h, mi, sec) => new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), h, mi, sec);
    const mon = d => d.toLocaleDateString([], { month: "short", timeZone: "UTC" });
    D.calendar = spans.map(([a, b], i) => {
      const days = []; for (let t = +a; t <= +b; t += DAY) days.push(ymd(new Date(t)));
      const detail = mon(a) === mon(b) ? `${mon(a)} ${a.getUTCDate()}–${b.getUTCDate()}` : `${mon(a)} ${a.getUTCDate()}–${mon(b)} ${b.getUTCDate()}`;
      // The week "ends" at 4am the next morning so a late Sunday tip doesn't flip everyone to next week mid-game.
      return { n: i + 1, label: `Week ${i + 1}`, detail, days, start: local(a, 0, 0, 0), end: new Date(+local(b, 23, 59, 59) + 4 * 3600e3) };
    });
    if (BB.OCCASIONS !== false) {
      const cal = D.calendar, L = cal.length;
      const tag = (w, k) => { if (w && !w.special) w.special = OCCASIONS[k]; };
      const weekOf = d => cal.find(w => w.days.includes(ymd(d)));
      const nov1 = utc(Y - 1, 10, 1);
      const thanksgiving = new Date(+nov1 + (((4 - nov1.getUTCDay() + 7) % 7) + 21) * DAY);   // fourth Thursday of November
      // The NCAA tournament always fills the last three weeks; the week before it is conference-tournament week.
      tag(cal[L - 1], "final4"); tag(cal[L - 2], "sweet16"); tag(cal[L - 3], "madness"); tag(cal[L - 4], "champ");
      tag(cal[0], "tipoff"); tag(weekOf(thanksgiving), "feast"); tag(weekOf(utc(Y - 1, 11, 25)), "holiday");
    }
  }

  const hoopsKey = n => `pickem.cbb.${SPORTS.cbb.season}.w${n}.v1`;
  const hoopsQualifies = g => {
    const P = SPORTS.cbb.power, ok = t => P.includes(t.conf) || !!t.rank;
    return SPORTS.cbb.rule === "both" ? ok(g.home) && ok(g.away) : ok(g.home) || ok(g.away);
  };

  // Turn "every Division I game this week" into the week's list: power-conference and Top 25
  // games, plus anything somebody already picked (so a game can't vanish once it's in play).
  function hoopsFilter(n) {
    const D = DATA.cbb, all = D.all[n];
    if (!all) return;
    const picked = new Set(Object.keys(D.picks[n] || {}).map(k => k.split("|")[0]));
    D.games[n] = all.filter(g => hoopsQualifies(g) || picked.has(g.id)).sort((a, b) => a.date - b.date);
    // A finished week never changes again — keep it on this device so standings stay quick.
    const w = D.calendar.find(x => x.n === n);
    if (!D.frozen[n] && D.picks[n] && !D.noTable && w && Date.now() > +w.end + DAY && D.games[n].length && D.games[n].every(g => g.completed || isVoid(g))) {
      D.frozen[n] = true;
      try { localStorage.setItem(hoopsKey(n), JSON.stringify(D.games[n])); } catch {}
    }
  }

  async function loadHoopsWeek(n, force) {
    const D = DATA.cbb;
    buildHoopsCalendar();
    const w = D.calendar.find(x => x.n === n);
    if (!w) return (D.games[n] = []);
    if (!D.all[n]) {
      try {
        const saved = JSON.parse(localStorage.getItem(hoopsKey(n)) || "null");
        if (Array.isArray(saved) && saved.length) { saved.forEach(g => g.date = new Date(g.date)); D.all[n] = saved; D.frozen[n] = true; }
      } catch {}
    }
    if (D.frozen[n]) { hoopsFilter(n); return D.games[n]; }
    const now = Date.now();
    const getDay = async d => {
      const url = `${SPORTS.cbb.espn}?groups=50&dates=${d}&limit=500`;
      let r = await fetch(url);
      if (!r.ok) r = await fetch(url);                       // ESPN hiccups now and then; one retry
      if (!r.ok) throw new Error("ESPN " + r.status);
      return ((await r.json()).events || []).map(ev => normalize(ev, d));
    };
    await Promise.all(w.days.map(async d => {
      const ts = +new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8));
      const c = D.days[d];
      if (c) {
        if (c.done) return;                                  // every game that day is final
        const near = now > ts - DAY && now < ts + 2 * DAY;   // yesterday, today, tomorrow: keep fresh
        if (now - c.at < (near ? (force ? 0 : 120000) : 1800000)) return;
      }
      try {
        const evs = await getDay(d);
        D.days[d] = { evs, at: now, done: now > ts + 1.5 * DAY && evs.every(g => g.completed || isVoid(g)) };
      } catch (e) { if (!c) throw e; }                       // keep showing what we had if a refresh fails
    }));
    const seen = new Set();
    D.all[n] = w.days.flatMap(d => D.days[d]?.evs || []).filter(g => !seen.has(g.id) && seen.add(g.id));
    D.fetchedAt[n] = now;
    hoopsFilter(n);
    return D.games[n];
  }

  function currentWeek(sp = S.sport) {
    const cal = DATA[sp].calendar, now = Date.now();
    const hit = cal.find(w => now >= w.start && now <= w.end);
    if (hit) return hit.n;
    const next = cal.find(w => now < w.start);   // between weeks (or before the season): the next one up
    if (next) return next.n;
    return cal.length ? cal[cal.length - 1].n : 1;
  }

  // How many of today's games this person still has to pick, per sport (shown on the sport switch).
  const openToday = sp => {
    const D = DATA[sp];
    if (!S.player || !D.calendar.length) return 0;
    const n = currentWeek(sp), games = D.games[n], picks = D.picks[n];
    if (!games || !picks) return 0;
    const today = dayKey(new Date());
    return games.filter(g => !locked(g) && !isVoid(g) && dayKey(g.date) === today && !picks[key(g.id, S.player)]).length;
  };

  // ── Supabase (plain REST, no SDK) ────────────────────────────────────────
  const sb = (path, opt = {}) => fetch(`${C.SUPABASE_URL}/rest/v1/${path}`, {
    ...opt, headers: { apikey: C.SUPABASE_KEY, "Content-Type": "application/json", ...(opt.headers || {}) },
  });

  async function loadPicks(week, sp = S.sport) {
    const D = DATA[sp], T = SPORTS[sp];
    if (!configured) { D.picks[week] = D.picks[week] || {}; if (sp === "cbb") hoopsFilter(week); return; }
    const r = await sb(`${T.table}?season=eq.${T.season}&week=eq.${dbWeek(week, sp)}&select=game_id,player,pick`);
    if (sp === "cbb" && r.status === 404) { D.noTable = true; D.picks[week] = {}; hoopsFilter(week); return; }   // basketball table not created yet
    if (!r.ok) throw new Error("Supabase " + r.status);
    const rows = await r.json();
    const m = {};
    rows.forEach(x => m[key(x.game_id, x.player)] = x.pick);
    D.picks[week] = m;
    if (sp === "cbb") { D.noTable = false; hoopsFilter(week); }
    if (sp === "cfb" && week >= 16) {   // postseason: tiebreaker totals too
      const t = await sb(`tiebreakers?season=eq.${T.season}&week=eq.${week}&select=game_id,player,total`);
      if (t.status === 404) { D.noTb = true; D.tb[week] = {}; return; }
      if (!t.ok) throw new Error("Supabase " + t.status);
      const tm = {}; (await t.json()).forEach(x => tm[key(x.game_id, x.player)] = x.total);
      D.tb[week] = tm; D.noTb = false;
    }
  }

  async function saveTotal(week, gameId, raw) {
    const D = DATA[S.sport], T = SPORTS[S.sport];
    if (!S.player || D.noTb || String(raw).trim() === "") return;
    const v = Math.round(Number(raw));
    if (!Number.isFinite(v) || v < 0 || v > 250) { toast("Total points: a number from 0 to 250", true); delete S.tbDraft[gameId]; render(); return; }
    D.tb[week] = D.tb[week] || {};
    const k = key(gameId, S.player), prev = D.tb[week][k];
    delete S.tbDraft[gameId];
    if (prev === v) return;
    D.tb[week][k] = v;
    if (!configured) { toast("Demo mode — add Supabase keys to save"); return; }
    S.saving++;
    try {
      const r = await sb("tiebreakers?on_conflict=season,week,game_id,player", {
        method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify({ season: T.season, week, game_id: gameId, player: S.player, total: v }),
      });
      if (!r.ok) throw new Error(await r.text());
      toast(`Tiebreaker saved: ${v}`);
    } catch (e) {
      console.error(e);
      if (prev == null) delete D.tb[week][k]; else D.tb[week][k] = prev;
      render();
      toast("Couldn't save — check connection", true);
    } finally { S.saving--; }
  }

  async function savePick(week, gameId, teamId) {
    if (!S.player) return;
    const sp = S.sport, D = DATA[sp], T = SPORTS[sp];
    if (D.noTable) { toast("Basketball picks aren't set up yet", true); return; }
    const k = key(gameId, S.player);
    const prev = D.picks[week][k];
    D.picks[week][k] = teamId;
    if (S.conf === "__open") S.keep.add(gameId);
    render();
    if (!configured) { toast("Demo mode — add Supabase keys to save"); return; }
    S.saving++;
    try {
      const r = await sb(`${T.table}?on_conflict=season,week,game_id,player`, {
        method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify({ season: T.season, week: dbWeek(week, sp), game_id: gameId, player: S.player, pick: teamId }),
      });
      if (!r.ok) throw new Error(await r.text());
      toast("Saved");
    } catch (e) {
      console.error(e);
      if (prev) D.picks[week][k] = prev; else delete D.picks[week][k];
      if (S.sport === sp) render();
      toast("Couldn't save — check connection", true);
    } finally { S.saving--; }
  }

  // ── grading ──────────────────────────────────────────────────────────────
  // House rule: everyone picks every game. No pick on a finished game = a loss.
  const grade = (g, pick) => {
    if (isVoid(g)) return null;
    if (!pick) return locked(g) ? (g.completed ? "bad" : "pending") : null;
    return !g.completed || !g.winner ? "pending" : g.winner === pick ? "ok" : "bad";
  };

  function tally(week) {
    const out = {};
    C.PLAYERS.forEach(p => out[p] = { ok: 0, bad: 0, pending: 0, picked: 0 });
    (S.games[week] || []).forEach(g => C.PLAYERS.forEach(p => {
      const r = grade(g, S.picks[week]?.[key(g.id, p)]);
      if (!r) return; out[p].picked++; out[p][r]++;
    }));
    return out;
  }

  // ── render ───────────────────────────────────────────────────────────────
  function renderHeader() {
    $("#title").innerHTML = esc(C.TITLE).replace(/(\S+)$/, "<span>$1</span>");
    $("#eyebrow").textContent = SP().eyebrow;
    document.body.dataset.sport = S.sport;
    $("#sports").hidden = !HOOPS_ON;
    document.querySelectorAll("#sports button").forEach(b => {
      const on = b.dataset.sport === S.sport; b.classList.toggle("on", on); b.setAttribute("aria-selected", on);
      const left = openToday(b.dataset.sport);
      let c = b.querySelector(".cnt");
      if (left) { if (!c) { c = el("b", "cnt"); b.appendChild(c); } c.textContent = left; c.title = `${left} of today's games still to pick`; } else if (c) c.remove();
    });
    $("#footnote").textContent = `Scores from ESPN · picks lock at ${SP().lock} · refreshes every 2 min during games`;
    const who = $("#who"); who.innerHTML = "";
    if (SECURE) {
      who.appendChild(el("span", "me", S.player ? esc(S.player) : "Viewer"));
    } else {
      C.PLAYERS.forEach(p => {
        const b = el("button", p === S.player ? "on" : "", esc(p));
        b.onclick = () => { S.player = p; localStorage.setItem("pickem.player", p); render(); };
        who.appendChild(b);
      });
    }
    if (NOTIFY_ON && S.player) who.appendChild(bellButton());
    const pulled = S.week != null && S.fetchedAt[S.week];
    $("#fresh").hidden = S.week == null;
    $("#freshat").textContent = pulled ? `Scores updated ${fmtTime(new Date(pulled))} ·` : "";
    const w = S.calendar.find(x => x.n === S.week);
    const occ = w?.special || null;
    $("#wlabel").textContent = occ ? `${occ.icon} ${occ.name}` : w ? w.label : S.week == null ? "Week —" : `Week ${S.week}`;
    $("#wdates").textContent = !w ? "" : occ ? `${w.label} · ${w.detail}` : w.detail;
    const bs = document.body.style;
    if (occ) { bs.setProperty("--flag", occ.accent); bs.setProperty("--bar", occ.bar); } else { bs.removeProperty("--flag"); bs.removeProperty("--bar"); }
    const wi = S.calendar.findIndex(x => x.n === S.week);
    $("#prev").disabled = wi <= 0;
    $("#next").disabled = wi < 0 || wi >= S.calendar.length - 1;
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
    $("#banner").innerHTML = !configured ? `<div class="banner"><b>Demo mode.</b> Picks aren't being saved yet — open <code>config.js</code> and paste in your Supabase URL and anon key.</div>`
      : DATA[S.sport].noTable ? `<div class="banner"><b>Basketball isn't switched on yet.</b> You can browse the schedule, but picks can't be saved until the one-time Supabase setup is run (<code>supabase-basketball.sql</code>). Football is unaffected.</div>` : "";
  }

  function teamButton(g, side, mine) {
    const t = g[side];
    const picked = mine === t.id;
    const b = el("button", `team ${side}${picked ? " picked" : ""}${g.completed && g.winner && g.winner !== t.id ? " dim" : ""}`);
    b.style.setProperty("--tc", "#" + t.color);
    if (picked) { b.style.background = "#" + t.color; b.style.color = idealText(t.color); }
    b.disabled = locked(g);
    b.setAttribute("aria-pressed", picked);
    b.innerHTML = `${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy">` : `<span class="nologo">${esc((t.abbr || "?").slice(0, 4))}</span>`}
      <div class="n">${t.rank ? `<div class="rk">${/^NCAA Tournament/.test(g.event || "") ? `${t.rank} SEED` : `#${t.rank}`}</div>` : ""}<div class="nm" title="${esc(t.full)}">${esc(t.name)}</div><div class="rec">${esc(t.record)}</div></div>
      ${g.state !== "pre" ? `<div class="sc">${t.score}</div>` : ""}`;
    b.onclick = () => savePick(S.week, g.id, t.id);
    return b;
  }

  function renderPicks(v) {
    const games = S.games[S.week] || [];
    const occ = occOf(S.week);
    if (occ) {
      const tt = tally(S.week), top = Math.max(...C.PLAYERS.map(p => tt[p].ok));
      const over = games.length && games.every(g => g.completed || isVoid(g));
      const champs = over && top > 0 ? C.PLAYERS.filter(p => tt[p].ok === top) : [];
      const line = !occ.prize ? occ.blurb : champs.length ? `${esc(listNames(champs))} ${champs.length > 1 ? "share" : "took"} ${occ.prize}.` : `${occ.blurb} Most wins this week takes ${occ.prize}.` + (games.some(g => g.trophy) ? " Highlighted games carry their own trophy." : "");
      v.appendChild(el("div", "occ", `<i>${occ.icon}</i><div><b>${esc(occ.name)}</b><span>${line}</span></div>`));
    }
    if (!games.length) { v.appendChild(el("div", "empty", "<b>No games yet</b>ESPN hasn't posted this week's schedule.")); return; }

    // ── search + conference filter (display only — never affects scoring) ──
    const CONF_NAMES = SP().confs, POWER = SP().power;
    const evBase = g => (g.event || "").split(" - ")[0];
    const evts = POWER ? [...new Set(games.map(evBase).filter(Boolean))].sort() : [];
    if (S.conf.startsWith("evt:") && !evts.includes(S.conf.slice(4))) S.conf = "";   // that event isn't in this week
    const matches = g => {
      if (S.conf.startsWith("evt:")) { if (evBase(g) !== S.conf.slice(4)) return false; }
      else if (S.conf === "__ranked") { if (!g.home.rank && !g.away.rank) return false; }
      else if (S.conf === "__open") { if ((locked(g) || S.picks[S.week]?.[key(g.id, S.player)]) && !S.keep.has(g.id)) return false; }
      else if (S.conf === "__other") { if (CONF_NAMES[g.home.conf] && CONF_NAMES[g.away.conf]) return false; }
      else if (S.conf && g.home.conf !== S.conf && g.away.conf !== S.conf) return false;
      const q = S.q.trim().toLowerCase();
      if (!q) return true;
      const hay = `${g.home.name} ${g.home.full} ${g.home.abbr} ${g.away.name} ${g.away.full} ${g.away.abbr}`.toLowerCase();
      return q.split(/\s+/).every(t => hay.includes(t));
    };
    const shown = games.filter(matches);

    const fr = el("div", "filters");
    const wrap = el("div", "searchwrap");
    const inp = document.createElement("input");
    inp.type = "search"; inp.placeholder = "Search teams…"; inp.value = S.q;
    inp.enterKeyHint = "search";
    inp.setAttribute("aria-label", "Search teams");
    inp.oninput = e => { S.q = e.target.value; S.refocus = true; render(); };
    inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); inp.blur(); } };
    wrap.appendChild(inp);
    if (S.q) {
      const x = el("button", "clear", "×");
      x.type = "button"; x.setAttribute("aria-label", "Clear search");
      x.onclick = () => { S.q = ""; render(); };
      wrap.appendChild(x);
    }
    fr.appendChild(wrap);
    const sel = document.createElement("select");
    sel.setAttribute("aria-label", "Filter by conference");
    const allIds = [...new Set(games.flatMap(g => [g.home.conf, g.away.conf]).filter(Boolean))];
    const ids = allIds.filter(id => CONF_NAMES[id]).sort((a, b) => CONF_NAMES[a].localeCompare(CONF_NAMES[b]));
    const hasOther = allIds.some(id => !CONF_NAMES[id]);
    const opt = id => `<option value="${esc(id)}"${id === S.conf ? " selected" : ""}>${esc(CONF_NAMES[id])}</option>`;
    const other = hasOther ? `<option value="__other"${S.conf === "__other" ? " selected" : ""}>Other</option>` : "";
    const owe = games.filter(g => !isVoid(g) && !locked(g) && !S.picks[S.week]?.[key(g.id, S.player)]).length;
    const unpicked = `<option value="__open"${S.conf === "__open" ? " selected" : ""}>Unpicked${owe ? ` (${owe})` : ""}</option>`;
    sel.innerHTML = !POWER
      ? `<option value="">All conferences</option>` + unpicked + ids.map(opt).join("") + other
      : `<option value="">All games</option>` + unpicked + `<option value="__ranked"${S.conf === "__ranked" ? " selected" : ""}>Top 25 games</option>` +
        (evts.length ? `<optgroup label="Events">${evts.map(e => `<option value="evt:${esc(e)}"${S.conf === "evt:" + e ? " selected" : ""}>${eventIcon(games.find(g => evBase(g) === e))} ${esc(e)}</option>`).join("")}</optgroup>` : "") +
        `<optgroup label="Power conferences">${ids.filter(id => POWER.includes(id)).map(opt).join("")}</optgroup>` +
        `<optgroup label="Everyone else">${ids.filter(id => !POWER.includes(id)).map(opt).join("")}${other}</optgroup>`;
    sel.onchange = e => { S.conf = e.target.value; S.keep.clear(); render(); };
    fr.appendChild(sel);
    v.appendChild(fr);
    if (S.refocus) { S.refocus = false; requestAnimationFrame(() => { inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch {} }); }
    const filtered = shown.length !== games.length;
    const t = tally(S.week)[S.player];
    const openCount = games.filter(g => !isVoid(g)).length;
    const made = games.filter(g => !isVoid(g) && S.picks[S.week]?.[key(g.id, S.player)]).length;
    const left = games.filter(g => !isVoid(g) && !locked(g) && !S.picks[S.week]?.[key(g.id, S.player)]).length;
    const prog = el("div", "progress");
    prog.innerHTML = `<b>${made}<span style="color:var(--mute)">/${openCount}</span></b><div class="bar"><i style="width:${openCount ? 100 * made / openCount : 0}%"></i></div><span>${esc(S.player)}${left ? ` · <b style="font-size:15px;color:var(--loss)">${left}</b> still open` : " · all set"}${t.ok + t.bad ? ` · <b style="font-size:15px">${t.ok}–${t.bad}</b>` : ""}</span>`;
    if (filtered) prog.innerHTML += `<span class="fcount">${shown.length} of ${games.length} games</span>`;
    v.appendChild(prog);

    if (!shown.length && S.conf === "__open" && !S.q.trim()) { v.appendChild(el("div", "empty", `<b>All caught up</b>Nothing left to pick this week.`)); return; }
    if (!shown.length) { v.appendChild(el("div", "empty", `<b>No games match</b>Try a different team name or set the ${POWER ? "filter" : "conference"} back to "All".`)); return; }

    // Trophy game strip: what's at stake, the total-points tiebreaker, and (when final) who won it.
    const trophyBar = (g, mine) => {
      const D = DATA[S.sport], tb = D.tb[S.week] || {}, myTotal = tb[key(g.id, S.player)];
      const total = g.home.score + g.away.score;
      let line, input = "";
      if (D.noTb) line = "The total-points tiebreaker needs a one-time Supabase setup.";
      else if (g.state === "pre") {
        const val = S.tbDraft[g.id] ?? (myTotal ?? "");
        line = mine ? (myTotal != null ? "Tiebreaker saved. You can change it until kickoff." : "Now guess the total points scored by both teams.") : "Pick a winner, then guess total points for the tiebreaker.";
        input = `<label>Total pts<input type="number" inputmode="numeric" min="0" max="250" step="1" data-tb="${esc(g.id)}" value="${esc(val)}" aria-label="Total points tiebreaker for ${esc(g.trophy.name)}"></label>`;
      } else if (!g.completed) line = `Your total: ${myTotal ?? "none"} · Live total: ${total}`;
      else {
        const w = trophyWinners(g, S.week);
        line = `${w.length ? `<b style="display:inline;font:inherit;text-transform:none;letter-spacing:0">${esc(listNames(w))} ${w.length > 1 ? "share it" : "wins it"}.</b> ` : "No winner. "}Final total ${total}` + (myTotal != null ? ` · You: ${myTotal} (${Math.abs(myTotal - total)} off)` : "");
      }
      const bar = el("div", "tbk", `<span class="ti">${g.trophy.icon}</span><div class="tx"><b>${esc(g.trophy.name)} trophy</b><small>${line}</small></div>${input}`);
      const inp = bar.querySelector("input");
      if (inp) {
        inp.oninput = e => { S.tbDraft[g.id] = e.target.value; };
        inp.onchange = e => saveTotal(S.week, g.id, e.target.value);
        inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); inp.blur(); } };
      }
      return bar;
    };

    const buildCard = (g, showDay) => {
      const mine = S.picks[S.week]?.[key(g.id, S.player)];
      const card = el("div", "game" + (g.trophy ? " trophy" : ""));
      if (g.event) {
        const [name, ...rest] = g.event.split(" - ");
        card.appendChild(el("div", "evt", `<span class="t"><i>${tagIcon(g)}</i><b>${esc(name)}</b>${rest.length ? `<em>&nbsp;· ${esc(rest.join(" · "))}</em>` : ""}</span>${g.place ? `<span class="where">${esc(g.place)}</span>` : ""}`));
      }
      const m = el("div", "matchup");
      m.appendChild(teamButton(g, "away", mine));
      m.appendChild(el("div", "at", g.neutral ? "VS" : "AT"));
      m.appendChild(teamButton(g, "home", mine));
      card.appendChild(m);
      if (g.trophy) card.appendChild(trophyBar(g, mine));

      const stCls = g.state === "in" ? "live" : g.completed ? "final" : "";
      const stTxt = `${showDay ? fmtDay(g.date).slice(0, 3) + " · " : ""}${g.state === "pre" ? (g.tbd ? "Time TBD" : fmtTime(g.date)) : esc(g.statusText)}${g.tv ? " · " + esc(g.tv) : ""}`;
      const gr = grade(g, mine);
      let badge = "";
      if (gr === "ok") badge = `<span class="grade ok">✓ Correct</span>`;
      else if (gr === "bad") badge = `<span class="grade bad">✗ Missed</span>`;
      else if (locked(g) && !mine) badge = `<span class="grade ${g.completed ? "bad" : "lock"}">✗ No pick</span>`;
      else if (locked(g)) badge = `<span class="grade lock">Locked</span>`;
      const meta = el("div", "meta", `<span class="st ${stCls}">${stTxt}</span><span class="mr">${badge}</span>`);
      const on = !!S.favs[g.id];
      const hb = el("button", "fav" + (on ? " on" : ""), on ? "♥" : "♡");
      hb.type = "button";
      hb.setAttribute("aria-label", on ? "Unpin game" : "Pin game to top");
      hb.setAttribute("aria-pressed", on);
      hb.onclick = () => toggleFav(g.id);
      meta.querySelector(".mr").appendChild(hb);
      card.appendChild(meta);
      return card;
    };

    const byDay = (list, showDayInMeta) => {
      let lastDay = null;
      list.forEach(g => {
        const dk = dayKey(g.date);
        if (!showDayInMeta && dk !== lastDay) {
          lastDay = dk;
          const n = list.filter(x => dayKey(x.date) === dk).length;
          v.appendChild(el("div", "day", `<h2>${fmtDay(g.date)}</h2><span>${fmtDate(g.date)} · ${n} game${n > 1 ? "s" : ""}</span>`));
        }
        v.appendChild(buildCard(g, showDayInMeta));
      });
    };

    // Pinned games float to the top; finished games sink to the bottom.
    const pinned = shown.filter(g => S.favs[g.id]);
    const rest = shown.filter(g => !S.favs[g.id]);
    const over = g => g.completed || isVoid(g);
    const active = rest.filter(g => !over(g));
    const done = rest.filter(over);

    if (pinned.length) {
      v.appendChild(el("div", "day sec", `<h2>★ Pinned</h2><span>${pinned.length} game${pinned.length > 1 ? "s" : ""}</span>`));
      byDay(pinned, true);
    }
    byDay(active, false);
    if (done.length) {
      v.appendChild(el("div", "day sec finals", `<h2>✓ Finals</h2><span>${done.length} game${done.length > 1 ? "s" : ""}</span>`));
      byDay(done, false);
    }
  }

  function renderSheet(v) {
    const games = S.games[S.week] || [];
    if (!games.length) { v.appendChild(el("div", "empty", "<b>Nothing to compare</b>No games this week.")); return; }
    const tb = el("table", "sheet");
    tb.innerHTML = `<thead><tr><th>Game</th>${C.PLAYERS.map(p => `<th>${esc(p)}</th>`).join("")}</tr></thead>`;
    const body = el("tbody");
    games.forEach(g => {
      const tr = el("tr");
      const score = g.state !== "pre" ? `${g.away.abbr} ${g.away.score} – ${g.home.score} ${g.home.abbr}` : `${fmtDay(g.date).slice(0, 3)} ${g.tbd ? "TBD" : fmtTime(g.date)}`;
      tr.appendChild(el("td", "g", `${g.event ? tagIcon(g) + " " : ""}${esc(g.away.abbr)} ${g.neutral ? "vs" : "@"} ${esc(g.home.abbr)}<small>${esc(score)}${g.completed ? " · Final" : g.state === "in" ? " · Live" : ""}</small>`));
      C.PLAYERS.forEach(p => {
        const pk = S.picks[S.week]?.[key(g.id, p)];
        const hide = C.HIDE_PICKS_UNTIL_KICKOFF && p !== S.player && !locked(g);   // viewer: S.player null hides all
        let cls = "p", txt = "—";
        if (!pk) { const gr = grade(g, pk); cls += gr === "bad" ? " bad" : " none"; if (gr === "bad") txt = "none"; }
        else if (hide) { cls += " hid"; txt = "hidden"; }
        else { txt = pk === g.home.id ? g.home.abbr : g.away.abbr; const gr = grade(g, pk); if (gr === "ok") cls += " ok"; if (gr === "bad") cls += " bad"; }
        const tot = g.trophy && !hide ? DATA[S.sport].tb[S.week]?.[key(g.id, p)] : null;
        const won = g.trophy && trophyWinners(g, S.week).includes(p) ? " " + g.trophy.icon : "";
        tr.appendChild(el("td", cls, esc(txt) + won + (tot != null ? `<small>${tot} pts</small>` : "")));
      });
      body.appendChild(tr);
    });
    tb.appendChild(body);
    const t = tally(S.week);
    const foot = el("tfoot");
    foot.innerHTML = `<tr><td>Week total</td>${C.PLAYERS.map(p => `<td>${t[p].ok}–${t[p].bad}</td>`).join("")}</tr>`;
    tb.appendChild(foot);
    v.appendChild(tb);
    if (C.HIDE_PICKS_UNTIL_KICKOFF) v.appendChild(el("p", "note", `Other people's picks stay hidden until ${SP().lock}.`));
  }

  async function renderStandings(v) {
    v.appendChild(el("div", "empty", "Adding up the season…"));
    const sp = S.sport, tok = S.rtok;
    const cur = currentWeek();
    const weeks = S.calendar.slice(0, S.calendar.findIndex(w => w.n === cur) + 1).map(w => w.n);
    const one = async n => { await loadWeek(n, false, sp); if (!DATA[sp].picks[n]) await loadPicks(n, sp); };
    if (sp === "cbb") { for (let i = 0; i < weeks.length; i += 3) await Promise.all(weeks.slice(i, i + 3).map(one)); }   // a few weeks at a time — each is 7 requests
    else await Promise.all(weeks.map(one));
    if (tok !== S.rtok) return;                              // they've moved on (other tab or other sport)
    v.innerHTML = "";
    const season = {}; C.PLAYERS.forEach(p => season[p] = { ok: 0, bad: 0, weeksWon: 0, trophies: [] });
    const perWeek = weeks.map(n => {
      const t = tally(n);
      const done = (S.games[n] || []).length && (S.games[n] || []).every(g => g.completed || isVoid(g));
      const best = Math.max(...C.PLAYERS.map(p => t[p].ok));
      const occ = occOf(n);
      C.PLAYERS.forEach(p => { season[p].ok += t[p].ok; season[p].bad += t[p].bad; if (done && t[p].ok === best && best > 0) { season[p].weeksWon++; if (occ?.prize) season[p].trophies.push(occ.icon); } });
      (S.games[n] || []).forEach(g => trophyWinners(g, n, sp).forEach(p => season[p].trophies.push(g.trophy.icon)));   // trophy games
      return { n, t, done, best, occ };
    });
    // Rank by wins, then fewer losses, then weeks won. Equal on all three = tied.
    const rankKey = p => [season[p].ok, -season[p].bad, season[p].weeksWon];
    const cmp = (a, b) => { const x = rankKey(a), y = rankKey(b); for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) return y[i] - x[i]; return 0; };
    const order = [...C.PLAYERS].sort(cmp);
    const top = season[order[0]].ok;
    const ordinal = n => n + (["th","st","nd","rd"][((n % 100) - 20) % 10] || ["th","st","nd","rd"][n % 100] || "th");
    const pod = el("div", "podium");
    let place = 0;
    order.forEach((p, i) => {
      if (i === 0 || cmp(order[i - 1], p) !== 0) place = i + 1;
      const tied = order.filter(q => cmp(q, p) === 0).length > 1;
      const s = season[p]; const tot = s.ok + s.bad; const pct = tot ? Math.round(1000 * s.ok / tot) / 10 : 0;
      const lead = place === 1 && tot > 0;
      const back = top - s.ok;
      const label = tot ? `${tied ? "T-" : ""}${ordinal(place)}` : "";
      pod.appendChild(el("div", "pl" + (lead ? " lead" : ""),
        `${label ? `<div class="crown">${label}</div>` : ""}<div class="name">${esc(p)}</div><div class="rec">${s.ok}–${s.bad}</div><div class="sub">${pct}% · ${s.weeksWon} week${s.weeksWon === 1 ? "" : "s"} won${!lead && back ? ` · ${back} back` : ""}</div>${s.trophies.length ? `<div class="case" aria-label="Trophies won">${s.trophies.join(" ")}</div>` : ""}`));
    });
    v.appendChild(pod);
    const tb = el("table", "wk");
    tb.innerHTML = `<thead><tr><th>Week</th>${C.PLAYERS.map(p => `<th>${esc(p)}</th>`).join("")}</tr></thead>`;
    const body = el("tbody");
    perWeek.slice().reverse().forEach(({ n, t, done, best, occ }) => {
      const tr = el("tr");
      tr.appendChild(el("td", "w", `${occ ? `${occ.icon} ${esc(occ.name)}` : `Week ${n}`}${done ? "" : ` <small style="color:var(--mute)">· in progress</small>`}`));
      C.PLAYERS.forEach(p => tr.appendChild(el("td", done && t[p].ok === best && best > 0 ? "best" : "", t[p].picked ? `${t[p].ok}–${t[p].bad}${occ?.prize && done && t[p].ok === best && best > 0 ? " " + occ.icon : ""}` : "—")));
      body.appendChild(tr);
    });
    tb.appendChild(body);
    v.appendChild(tb);
    v.appendChild(el("p", "note", "Correct picks count 1 point each. A game left unpicked counts as a loss. Season rank: most wins, then fewest losses, then most weeks won — equal on all three is a tie. Ties for a week's best count as a week won for everyone tied." + (S.calendar.some(w => w.special) ? " Named weeks hand a trophy to that week's winner." : "") + (S.calendar.some(w => w.post) ? " Trophy games go to whoever picked the winner with the closest total points; trophies are bragging rights and don't change the standings." : "")));
  }

  function renderWelcome(v) {
    if (SECURE) {
      v.appendChild(el("div", "welcome", `<b>Private game</b><p>Picks are made through personal links. Open the link you were sent — this phone will remember you. Meanwhile you can browse <b style="font-size:inherit;display:inline;text-transform:none">The sheet</b> and <b style="font-size:inherit;display:inline;text-transform:none">Standings</b>.</p>`));
      // A Home Screen app keeps its own memory, separate from Safari's, so give people a way to sign it in.
      const w = v.lastChild, f = el("form", "paste");
      f.innerHTML = `<input type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Or paste your private link here" aria-label="Paste your private link"><button type="submit">Go</button>`;
      f.onsubmit = async e => {
        e.preventDefault();
        const raw = f.querySelector("input").value.trim();
        let token = raw; try { token = new URL(raw).searchParams.get("key") || raw; } catch {}
        const name = token && C.TOKEN_HASHES[await sha256(token.trim())];
        if (name && C.PLAYERS.includes(name)) location.replace(location.pathname + "?key=" + encodeURIComponent(token.trim()));
        else toast("That link isn't valid", true);
      };
      w.appendChild(f);
      return;
    }
    const w = el("div", "welcome", `<b>Who's picking?</b><p>Tap your name once. This phone will remember you.</p>`);
    const row = el("div", "choices");
    C.PLAYERS.forEach(p => {
      const b = el("button", "", esc(p));
      b.onclick = () => { S.player = p; localStorage.setItem("pickem.player", p); render(); };
      row.appendChild(b);
    });
    w.appendChild(row);
    v.appendChild(w);
  }

  function render() {
    S.rtok++;
    const tbFocus = document.activeElement?.dataset?.tb;
    renderHeader();
    const v = $("#view"); v.innerHTML = "";
    if (tbFocus) requestAnimationFrame(() => { const i = v.querySelector(`input[data-tb="${tbFocus}"]`); if (i) i.focus(); });
    if (!S.player && (S.tab === "picks" || !SECURE)) { renderWelcome(v); return; }
    if (S.tab === "picks") renderPicks(v);
    else if (S.tab === "sheet") renderSheet(v);
    else { const tok = S.rtok; renderStandings(v).catch(e => { console.error(e); if (tok === S.rtok) v.innerHTML = `<div class="empty"><b>Couldn't load standings</b>${esc(e.message)}</div>`; }); }
  }

  // ── boot & events ────────────────────────────────────────────────────────
  async function showWeek(n, force) {
    const sp = S.sport, D = DATA[sp];
    try {
      await loadWeek(n, force, sp);
      if (!D.picks[n] || force) await loadPicks(n, sp);
      if (D.week !== n) S.keep.clear();
      D.week = n;
      if (S.sport === sp) render();
    } catch (e) {
      console.error(e);
      if (S.sport === sp) $("#view").innerHTML = `<div class="empty"><b>Couldn't load</b>${esc(e.message)}. Pull to refresh or try again in a minute.</div>`;
    }
  }
  const stepWeek = d => { const i = S.calendar.findIndex(x => x.n === S.week), w = S.calendar[i + d]; if (w) showWeek(w.n); };
  $("#prev").onclick = () => stepWeek(-1);
  $("#next").onclick = () => stepWeek(1);

  // Manual refresh, for the Home Screen app where there's no browser reload button.
  $("#refresh").onclick = async () => {
    if (S.week == null) return;
    const b = $("#refresh"), sp = S.sport;
    b.disabled = true; b.textContent = "Refreshing…";
    try {
      const cur = currentWeek(sp);
      if (cur !== S.week) { await loadWeek(cur, true, sp); await loadPicks(cur, sp); }   // standings count the current week too
      await showWeek(S.week, true);
      primedAt = 0; primeOther();
    } finally { b.disabled = false; b.textContent = "Refresh"; }
  };

  // Open whichever sport is showing: first visit loads its schedule and jumps to the current week.
  async function openSport() {
    const sp = S.sport, D = DATA[sp];
    try {
      if (D.week != null) { render(); return showWeek(D.week); }
      if (sp === "cbb") buildHoopsCalendar(); else await loadWeek(1, false, "cfb");   // primes the calendar
      if (S.sport !== sp) return;
      await showWeek(currentWeek());
    } catch (e) {
      if (S.sport === sp) $("#view").innerHTML = `<div class="empty"><b>Couldn't reach ESPN</b>${esc(e.message)}</div>`;
    }
  }
  document.querySelectorAll("#sports button").forEach(b => b.onclick = () => {
    if (b.dataset.sport === S.sport) return;
    S.sport = b.dataset.sport;
    try { localStorage.setItem("pickem.sport", S.sport); } catch {}
    S.keep.clear();
    S.rtok++;
    renderHeader();
    if (DATA[S.sport].week == null) $("#view").innerHTML = `<div class="empty">Loading…</div>`;
    openSport();
  });
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });

  async function resolvePlayer() {
    if (SECURE) {
      const urlKey = new URLSearchParams(location.search).get("key");
      const token = urlKey || localStorage.getItem("pickem.token") || "";
      if (token) {
        const name = C.TOKEN_HASHES[await sha256(token.trim())];
        if (name && C.PLAYERS.includes(name)) {
          localStorage.setItem("pickem.token", token.trim());
          if (urlKey && !installing()) history.replaceState(null, "", location.pathname);
          return name;
        }
        if (urlKey) toast("That link isn't valid", true);
      }
      return null;   // viewer mode
    }
    const q = new URLSearchParams(location.search).get("player") || decodeURIComponent(location.hash.slice(1));
    const fromUrl = C.PLAYERS.find(p => p.toLowerCase() === (q || "").toLowerCase());
    if (fromUrl) { localStorage.setItem("pickem.player", fromUrl); if (!installing()) history.replaceState(null, "", location.pathname); return fromUrl; }
    const saved = localStorage.getItem("pickem.player");
    return C.PLAYERS.includes(saved) ? saved : null;
  }

  // ── the other sport, quietly ─────────────────────────────────────────────
  // Loads the sport that isn't showing (current week only) so the switch can show how many of
  // today's games are still unpicked, and so flipping over is instant. Never draws anything itself.
  let primedAt = 0;
  async function primeOther() {
    if (!HOOPS_ON || !S.player || Date.now() - primedAt < 5 * 60000) return;
    primedAt = Date.now();
    const sp = S.sport === "cfb" ? "cbb" : "cfb", D = DATA[sp];
    try {
      if (sp === "cbb") buildHoopsCalendar(); else if (!D.calendar.length) await loadWeek(1, false, "cfb");
      const n = currentWeek(sp);
      await loadWeek(n, false, sp);
      await loadPicks(n, sp);
      if (D.week == null) D.week = n;
      if (S.sport !== sp) renderHeader();
    } catch (e) { /* the count is a nicety; the sport still loads normally when opened */ }
  }

  // ── reminders (notifications on your phone) ──────────────────────────────
  // The app's part is small: ask permission, get this device's push address, and hand it to
  // Supabase along with whose phone it is and which sports they want. A scheduled job in
  // Supabase ("pickem-remind") does the checking and sending. Each phone only ever hears about
  // its own person's unpicked games.
  const NOTIFY_ON = C.NOTIFICATIONS !== false && !!configured;
  // The job is labeled "pickem-remind" in Supabase, but its web address kept the name it was created with.
  const FN_URL = `${C.SUPABASE_URL}/functions/v1/${C.REMINDER_FUNCTION || "bright-function"}`;
  const N = { open: false, busy: false, msg: "", err: false, sub: null,
    supported: "serviceWorker" in navigator && "PushManager" in window && "Notification" in window };
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isStandalone = () => navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  // "Installing" = an iPhone or iPad in Safari that arrived via the bell's set-up link (…&install=1).
  const installing = () => isIOS && !isStandalone() && new URLSearchParams(location.search).get("install") === "1";
  const prefs = () => { try { return { on: false, cfb: true, cbb: true, at: 0, ...(JSON.parse(localStorage.getItem("pickem.remind") || "null") || {}) }; } catch { return { on: false, cfb: true, cbb: true, at: 0 }; } };
  const savePrefs = p => { try { localStorage.setItem("pickem.remind", JSON.stringify(p)); } catch {} };
  const ub64 = t => Uint8Array.from(atob(t.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - t.length % 4) % 4)), ch => ch.charCodeAt(0));
  const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const fnCall = async (method, body) => {
    // A job that isn't deployed (or is still locked) answers without the headers a browser needs, which
    // shows up here as a failed request rather than a status code. Treat that the same as "not there".
    let r; try { r = await fetch(FN_URL, { method, headers: { "Content-Type": "application/json", apikey: C.SUPABASE_KEY }, body: body ? JSON.stringify(body) : undefined }); } catch { return { status: 0, ok: false, j: null }; }
    let j = null; try { j = await r.json(); } catch {}
    return { status: r.status, ok: r.ok, j };
  };
  const fail = (text, status) => Object.assign(new Error(text), { friendly: true, status });

  function bellButton() {
    const on = prefs().on && N.supported && Notification.permission === "granted";
    const b = el("button", "bell" + (on ? " on" : ""), `<svg viewBox="0 0 24 24" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" fill="none"/></svg>`);
    b.id = "bell"; b.type = "button";
    b.setAttribute("aria-label", on ? "Reminders are on" : "Set up reminders");
    b.onclick = () => {
      if (!N.open && isIOS && !isStandalone() && !installing()) {
        let t = ""; try { t = localStorage.getItem("pickem.token") || ""; } catch {}
        const who = SECURE ? (t ? "key=" + encodeURIComponent(t) : "") : "player=" + encodeURIComponent(S.player);
        if (who) { location.replace(location.pathname + "?" + who + "&install=1"); return; }
      }
      N.open = !N.open; N.msg = ""; renderRemind();
    };
    return b;
  }

  async function registerDevice(sub, p) {
    const j = sub.toJSON();
    let tz = null; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || null; } catch {}
    const r = await sb("rpc/push_register", { method: "POST", body: JSON.stringify({ p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_player: S.player, p_cfb: !!p.cfb, p_cbb: !!p.cbb && HOOPS_ON, p_tz: tz }) });
    if (!r.ok) throw fail(r.status === 404 ? "The Supabase setup for reminders hasn't been run yet." : "Couldn't save your reminder settings. Try again in a minute.", r.status);
  }

  async function subscribeDevice() {
    const reg = await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    const k = await fnCall("GET");
    if (!k.ok || !k.j?.publicKey) throw fail([0, 401, 404].includes(k.status) ? "Reminders aren't switched on yet. The reminder job (pickem-remind) hasn't been added in Supabase, or its \"Verify JWT\" setting is still on." : `The reminder job isn't answering (${k.j?.error || k.status}).`, k.status);
    let sub = await reg.pushManager.getSubscription();
    if (sub && sub.options?.applicationServerKey && b64u(sub.options.applicationServerKey) !== k.j.publicKey) { await sub.unsubscribe(); sub = null; }   // signed up under an old key
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: ub64(k.j.publicKey) });
    return sub;
  }

  const working = async (job, done) => {
    N.busy = true; N.msg = ""; N.err = false; renderRemind();
    try { await job(); N.msg = done || ""; }
    catch (e) { console.error(e); N.err = true; N.msg = e.friendly ? e.message : "That didn't work: " + (e.message || e); }
    N.busy = false; renderRemind(); renderHeader();
  };

  const turnOn = () => working(async () => {
    const perm = await Notification.requestPermission();        // has to be the first thing after the tap
    if (perm !== "granted") throw fail(perm === "denied" ? "Notifications are blocked for The Sheet on this device. Allow them in your device's notification settings, then try again." : "No problem. Tap again whenever you want them.");
    N.sub = await subscribeDevice();
    const p = { ...prefs(), on: true, at: Date.now() };
    await registerDevice(N.sub, p); savePrefs(p);
  }, "Reminders are on.");

  const turnOff = () => working(async () => {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = N.sub || (reg && await reg.pushManager.getSubscription());
    if (sub) { await sb("rpc/push_unregister", { method: "POST", body: JSON.stringify({ p_endpoint: sub.endpoint }) }).catch(() => {}); await sub.unsubscribe().catch(() => {}); }
    N.sub = null; savePrefs({ ...prefs(), on: false });
  }, "Reminders are off.");

  const setSport = (sp, on) => working(async () => { const p = { ...prefs(), [sp]: on, at: Date.now() }; await registerDevice(N.sub, p); savePrefs(p); }, "Saved.");

  const sendTest = () => working(async () => {
    const r = await fnCall("POST", { action: "test", endpoint: N.sub.endpoint });
    if (!r.j?.ok) throw fail(r.status === 404 && r.j?.error ? "This device isn't signed up any more. Turn reminders off and on again." : `The test didn't go through (${r.j?.detail || r.j?.error || r.j?.status || r.status}).`);
  }, "Test sent. It should pop up within a few seconds.");

  function renderRemind() {
    const box = $("#remind");
    const iosTab = isIOS && !isStandalone();
    // Setting up on an iPhone keeps the personal link in the address while this panel is open (see the bell).
    // Closing the panel tucks it away again.
    if (!N.open && /[?&](key|player|install)=/.test(location.search)) history.replaceState(null, "", location.pathname);
    box.hidden = !N.open || !S.player;
    if (box.hidden) return;
    const p = prefs(), dis = N.busy ? " disabled" : "";
    let body;
    if (iosTab) body = `<p>On an iPhone or iPad, reminders only work from the Home Screen version of The Sheet. One-time setup:</p>
      <ol><li>Tap the <b>Share</b> button (the square with an arrow).</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li><li>Open The Sheet from the new icon and tap the bell again.</li></ol>
      <p>Leave <b>Open as Web App</b> switched on, and do this with this panel showing so the new icon knows it's ${esc(S.player)}'s. If the new icon opens as "Viewer", paste your private link into the box it shows. An older Home Screen icon for The Sheet can be deleted afterward.</p>`;
    else if (!N.supported) body = `<p>This browser can't show notifications. Try The Sheet in Safari or Chrome.</p>`;
    else if (p.on && N.sub && Notification.permission === "granted") body = `<p>${esc(S.player)}, this device gets a morning summary when you have games to pick, and a last call about an hour before they start. Only your own games.</p>
      <label>🏈 Football reminders<input type="checkbox" data-sp="cfb"${p.cfb ? " checked" : ""}${dis}></label>
      ${HOOPS_ON ? `<label>🏀 Basketball reminders<input type="checkbox" data-sp="cbb"${p.cbb ? " checked" : ""}${dis}></label>` : ""}
      <div class="row"><button type="button" data-act="test"${dis}>Send a test</button><button type="button" data-act="off"${dis}>Turn off</button></div>`;
    else body = `<p>Get a heads-up on this device when you have unpicked games: a morning summary, and a last call about an hour before they start. Only your own games, and you can turn it off any time.</p>
      <button type="button" class="go" data-act="on"${dis}>${N.busy ? "Working…" : "Turn on reminders"}</button>`;
    box.innerHTML = `<div class="rh"><b>Reminders</b><button type="button" data-act="close" aria-label="Close">×</button></div>${body}${N.msg ? `<p class="msg${N.err ? " err" : ""}">${esc(N.msg)}</p>` : ""}`;
    box.querySelectorAll("[data-act]").forEach(b => b.onclick = () => ({ on: turnOn, off: turnOff, test: sendTest, close: () => { N.open = false; renderRemind(); } })[b.dataset.act]());
    box.querySelectorAll("input[data-sp]").forEach(c => c.onchange = () => setSport(c.dataset.sp, c.checked));
  }

  // Once a day, quietly make sure this device is still signed up (phones occasionally drop a subscription).
  async function refreshReminders() {
    const p = prefs();
    if (!NOTIFY_ON || !S.player || !p.on || !N.supported) return;
    try {
      if (Notification.permission !== "granted") { savePrefs({ ...p, on: false }); return; }
      const reg = await navigator.serviceWorker.register("sw.js");
      let sub = await reg.pushManager.getSubscription(), fresh = false;
      if (!sub) { sub = await subscribeDevice(); fresh = true; }
      N.sub = sub;
      if (fresh || Date.now() - (p.at || 0) > 20 * 3600e3) { await registerDevice(sub, p); savePrefs({ ...p, at: Date.now() }); }
    } catch (e) { console.warn("reminders:", e.message || e); }
    renderHeader(); if (N.open) renderRemind();
  }

  (async () => {
    // A tapped reminder opens e.g. ?sport=cbb&f=open: go to that sport with the Unpicked filter on.
    const qp = new URLSearchParams(location.search), wantSport = qp.get("sport"), wantOpen = qp.get("f") === "open";
    try { S.player = await resolvePlayer(); } catch (e) { console.error(e); }
    if (HOOPS_ON && SPORTS[wantSport]) { S.sport = wantSport; try { localStorage.setItem("pickem.sport", wantSport); } catch {} }
    if (wantOpen && S.player) { DATA[S.sport].conf = "__open"; S.tab = "picks"; }
    if (wantSport || wantOpen) history.replaceState(null, "", location.pathname);
    if (installing() && S.player && NOTIFY_ON) N.open = true;                 // came back from the bell's set-up reload: show the steps
    else if (qp.get("install") && !installing()) history.replaceState(null, "", location.pathname);
    renderHeader();
    if (N.open) renderRemind();
    await openSport();
    refreshReminders();
    setTimeout(primeOther, 1500);
    // Auto-refresh scores while games are on (every 2 minutes)
    setInterval(() => {
      if (document.hidden || S.saving || S.week == null) return;
      const live = (S.games[S.week] || []).some(g => g.state === "in" || (g.state === "pre" && g.date - Date.now() < 3600000));
      if (live && S.tab !== "standings") showWeek(S.week, true);
    }, 120000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden && S.week != null) { showWeek(S.week, true); primeOther(); } });
  })();
})();
</script>
</body>
</html>
